<!DOCTYPE html>
   <html>

    <head> 
            <style>
           
                .small-text{
                    font-size: 0.5em;
                    color: gray;
                }

                body{
                  display: flex;
                  justify-content: center;  
                  align-items: center;      
                  min-height: 100vh;            
                  margin: 0;
                  background-color: #f6f7fc;
                }

                label{
                  font-family: sans-serif;
                }

                legend{
                  font-family: sans-serif;
                }

                .helpmeiamsuffering{
                    font-size: 0.8em;
                    color: gray;
                }

                input[type="email"],[type="date"]{
                    width: 91.5%;
                    padding: 8px 20px;
                    border: none;
                    border-radius: 4px;
                    font-family: sans-serif;
                }

                input[type="text"]{
                    width: 100%;
                    padding: 8px 20px;
                    border: none;
                    border-radius: 4px;
                    font-family: sans-serif;
                    box-sizing: border-box;
                    
                }

                textarea{
                    width: 100%;
                    border: none;
                    border-radius: 4px;
                    font-family: sans-serif;
                }

                input[type="radio"] {
                    appearance: none;
                    -webkit-appearance: none;
                    width: 20px;
                    height: 20px;
                    border-radius: 50%;     
                    border: none;
                    background-color: white; 
                    margin-right: 5px;
                    vertical-align: middle;
                    position: relative;
                    cursor: pointer;
                }


                input[type="radio"]:checked::after {
                    content: "";
                    position: absolute;
                    top: 50%;
                    left: 50%;
                    width: 10px;
                    height: 10px;
                    background-color: orange;  
                    border-radius: 50%;
                    transform: translate(-50%, -50%);
                }


                input[name="tvshow"],[name="agree-with-terms"] {
                   
                    width: 20px;
                    height: 20px;
                    appearance: none;       
                    border-radius: 4px;
                    background-color: #ccc; 
                    margin-right: 5px;
                    vertical-align: middle;
                    cursor: pointer;
                    position: relative;
                    
                }


                input[name="tvshow"]:checked, [name="agree-with-terms"]:checked {
                    background-color: orange; 
                    border-color: orange;
                }

                input[name="tvshow"]:checked::after,
                [name="agree-with-terms"]:checked::after {
                    content: "";
                    position: absolute;
                    left: 6px;
                    top: 2px;
                    width: 6px;
                    height: 12px;
                    border: solid white;
                    border-width: 0 2px 2px 0;
                    transform: rotate(45deg);
                }

                button{
                    background-color: orange;
                    color: white;
                    padding: 15px 25px;
                    border: none;
                    border-radius: 4px;
                    font-size: 16px;
                    width: 30%;
                    cursor: pointer;
                    display: flex;
                    justify-content: center; 
                    align-items: center;      
                    text-align: center;

                }

                button:hover{
                    background-color: rgb(185, 120, 0);
                }

                label[name="tvshow"]{
                    color: #ccc;
                } 

                span{
                    color: #ccc;
                    font-size: 11px;
                }

                

                
            </style>
    </head>

    <body>  

        <div>   

            <form>  

                

                    <legend><h2>Favourite TV Shows survey</h2></legend>

                    <p><label><span class="helpmeiamsuffering">Help us to understand what TV shows are your favourite</span></label></p>
                    
                            
                        <p style="display: inline-block; margin-right: 1rem;">
                            <label> First name:<span class="small-text">(max 30 characters a-z and A-Z)</span><br><input id="first-name"  type="text" name="first-name" placeholder="e.g John"></label></p>

                        <p style="display: inline-block;">
                            <label> Last name:<span class="small-text">(max 30 characters a-z and A-Z)</span><br><input id="last-name" type="text" name="last-name" placeholder="e.g Smith"></label></p>

                            
                        <p><label> Email:<br><input id="email" type="email" name="email" placeholder="e.g.student@vilniustech.lt"></label></p>    
                            
                            
                        <p><label> Adress:</label>
                           <textarea id="dress" name="adress" rows="4" cols="40"></textarea></p>

                        
                        <p><label> Date of birth:<br><input id="birth" type="date" name="date-of-birth"></label></p>
                        
                        
                        <p><label>Gender:</label><br>
                            <label><input id="male" type="radio" name="gender">Male</label><br>
                            <label><input id="female" type="radio" name="gender">Female</label>
                        </p>
                            
                        <p><label> Favourite TV shows list:</label><br>
                           <textarea id="movies1" name="movies1" rows="2" cols="40"></textarea></p>    
                           <textarea id="movies2" name="movies2" rows="2" cols="40"></textarea></p>  
                           <textarea id="mobies2" name="movies3" rows="2" cols="40"></textarea></p>  


                        <p><label style="display: block; margin-bottom: 2px;">Your favourite TV show type:</label>

                            <label><input id="tv-Adventure" type="checkbox" name="tvshow"><span>Adventure</span></label>
                            <label><input id="tv-Drama" type="checkbox" name="tvshow"><span>Drama</span></label>   
                            <label><input id="tv-horror" type="checkbox" name="tvshow"><span>Horror</span></label>   
                            <label><input id="tv-Documentary" type="checkbox" name="tvshow"><span>Documentary</span></label>   
                            <label><input id="tv-other" type="checkbox" name="tvshow"><span>Other</span></label>   

                            

                            

                            <p><label><input id="agree-whit-terms" type="checkbox" name="agree-with-terms"> <span>Creating and account means you're okay with our Terms and Conditions and our Privacy Policy</span></label></p>  
                            
                            <button id="submit" name="submit"> Register </button>
                            <br>

                

            </form>

        </div>
        

    </body>


   </html>
