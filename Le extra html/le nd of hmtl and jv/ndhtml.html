<!DOCTYPE html>
<html lang="en">
<head>
   <link rel="stylesheet" href="lend.css">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sine Wave Controls</title>
</head>
<body>

  <canvas id="sineCanvas" width="800" height="400"></canvas>

  <br><br>

  
  <div>
  <section class="container">

         <section class="item1"><button id="ampMinus" name="Clear"> - </button></section>
         <section class="item2"><button id="ampPlus" name="pm"> + </button></section>
         <section class="item3"><span id="ampValue">100</span></section>

         <section class="item4"><button id="fMinus" name="devide"> - </button></section>
         <section class="item5"><button id="fPlus" name="multy"> + </button></section>
         <section class="item6"> <span id="freqValue">0.02</span></section>

         <section class="item7"><button id="spMinus" name="plus"> - </button></section>
         <section class="item8"><button id="spPlus" name="equal"> + </button></section>
         <section class="item9"><span id="speedValue">0.05</span></section>
         
         <section class="item10"><button id="graph" name="graph"> GRAPH </button></section>
         <section class="item11"><button id="color" name="color"> COLOR </button></section>
         <section class="item12"><button id="reset" name="reset"> RESET </button></section>
         




        </section>
  </div>
  
  
  
  
  
  
  
  
  
  
  
  
 

  <script src="lendjs.js"></script>
</body>
</html>
